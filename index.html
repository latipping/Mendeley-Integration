}
function cleanXml(s){
  s = String(s == null ? "" : s).replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F\uFFFE\uFFFF]/g, "");
  let out = "";
  for (let i = 0; i < s.length; i++){
    const c = s.charCodeAt(i);
    if (c >= 0xD800 && c <= 0xDBFF){ const d = s.charCodeAt(i + 1); if (d >= 0xDC00 && d <= 0xDFFF){ out += s[i] + s[i + 1]; i++; } continue; }
    if (c >= 0xDC00 && c <= 0xDFFF) continue;
    out += s[i];
  }
  return out;
}
const xesc = s => cleanXml(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
const xhtmlDoc = (title, body) => '<?xml version="1.0" encoding="UTF-8"?>\n<!DOCTYPE html>\n<html xmlns="http://www.w3.org/1999/xhtml" xmlns:epub="http://www.idpf.org/2007/ops" xml:lang="en-GB" lang="en-GB">\n<head>\n<meta charset="UTF-8"/>\n<title>' + xesc(title) + '</title>\n<link rel="stylesheet" type="text/css" href="style.css"/>\n</head>\n<body>\n' + body + '\n</body>\n</html>\n';

async function exportSource(d, needPdf, onStatus){
  if (!d.file_attached) return null;
  let f = null;
  try { f = await fileMetaFor(d.id); } catch (e) { return null; }
  if (!f) return null;
  const short = (d.title || "paper").slice(0, 40);
  let m = await DB.get("txt:" + f.id).catch(() => null);
  if (m && m.v !== 2) m = null;
  let buf = null;
  if (!m || needPdf){
    buf = await DB.get("pdf:" + f.id).catch(() => null);
    if (!buf){
      try { onStatus("Downloading “" + short + "”…"); buf = await downloadPdf(f); await cachePdf(f.id, buf); }
      catch (e) { buf = null; }
    }
  }
  if (!m && buf){
    try {
      onStatus("Reading “" + short + "”…");
      const pdf = await loadPdfDoc(buf);
      m = await extractModel(pdf);
      pdf.destroy();
      DB.set("txt:" + f.id, m).catch(() => {});
    } catch (e) { m = null; }
  }
  return m || buf ? { m: m, buf: buf } : null;
}
const CAPTION = /^(Fig\.?|FIG\.?|Figure|FIGURE|Table|TABLE|Exhibit|EXHIBIT|Chart|Plate|Scheme)\s*[0-9IVX]+/;
function captionPages(m){
  const lines = new Map();
  m.items.forEach(it => { if (it.l === undefined) return; if (!lines.has(it.l)) lines.set(it.l, { p: it.p, t: "" }); lines.get(it.l).t += it.s; });
  const pages = new Set();
  lines.forEach(v => { if (CAPTION.test(v.t.trim())) pages.add(v.p); });
  return pages;
}
async function pageHasImage(page){
  try {
    const O = window.pdfjsLib.OPS; const ops = await page.getOperatorList();
    return ops.fnArray.some(fn => fn === O.paintImageXObject || fn === O.paintInlineImageXObject || fn === O.paintImageXObjectRepeat || (O.paintJpegXObject !== undefined && fn === O.paintJpegXObject));
  } catch (e) { return false; }
}
async function renderPageJpeg(page){
  const vp1 = page.getViewport({ scale: 1 });
  const vp = page.getViewport({ scale: Math.min(3, 1200 / vp1.width) });
  const c = document.createElement("canvas"); c.width = Math.floor(vp.width); c.height = Math.floor(vp.height);
  const ctx = c.getContext("2d");
  ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, c.width, c.height);
  await page.render({ canvasContext: ctx, viewport: vp }).promise;
  const img = ctx.getImageData(0, 0, c.width, c.height), px = img.data;
  for (let i = 0; i < px.length; i += 4){ const y = (px[i] * 299 + px[i + 1] * 587 + px[i + 2] * 114) / 1000; px[i] = px[i + 1] = px[i + 2] = y; }
  ctx.putImageData(img, 0, 0);
  const blob = await new Promise(r => c.toBlob(r, "image/jpeg", 0.72));
  c.width = 0; c.height = 0;
  if (!blob) throw new Error("render failed");
  return new Uint8Array(await blob.arrayBuffer());
}
async function figurePages(buf, m, ch, onStatus, addFile){
  const out = [];
  let pdf;
  try { pdf = await loadPdfDoc(buf); } catch (e) { return out; }
  try {
    const want = captionPages(m);
    for (let n = 2; n <= pdf.numPages; n++){ if (want.has(n)) continue; const page = await pdf.getPage(n); if (await pageHasImage(page)) want.add(n); page.cleanup(); }
    const pages = Array.from(want).filter(n => n >= 1 && n <= pdf.numPages).sort((a, b) => a - b).slice(0, 30);
    for (let k = 0; k < pages.length; k++){
      onStatus("Adding figure pages (" + (k + 1) + " of " + pages.length + ")…");
      try {
        const page = await pdf.getPage(pages[k]);
        const jpg = await renderPageJpeg(page); page.cleanup();
        const href = "images/c" + ch + "-p" + pages[k] + ".jpg";
        addFile("OEBPS/" + href, jpg);
        out.push({ page: pages[k], href: href });
      } catch (e) {}
    }
  } finally { try { pdf.destroy(); } catch (e) {} }
  return out;
}
function coverMap(m, hls){
  const byPage = new Map();
  m.items.forEach((it, i) => { if (it.l === undefined) return; let a = byPage.get(it.p); if (!a){ a = []; byPage.set(it.p, a); } a.push(i); });
  const cover = new Map();
  hls.forEach(a => (a.positions || []).forEach(pos => {
    if (!pos || !pos.top_left || !pos.bottom_right) return;
    const xl = Math.min(pos.top_left.x, pos.bottom_right.x), xr = Math.max(pos.top_left.x, pos.bottom_right.x);
    const yb = Math.min(pos.top_left.y, pos.bottom_right.y), yt = Math.max(pos.top_left.y, pos.bottom_right.y);
    for (const i of (byPage.get(pos.page) || [])){
      const it = m.items[i];
      const ib = it.y - it.h * 0.2, itp = it.y + it.h * 0.8;
      if (Math.min(yt, itp) - Math.max(yb, ib) < it.h * 0.4) continue;
      if (xr < it.x || xl > it.x + it.w) continue;
      const L = it.s.length, cw = it.w / Math.max(1, L);
      const s = Math.max(0, Math.min(L, Math.round((xl - it.x) / cw))), e = Math.max(0, Math.min(L, Math.round((xr - it.x) / cw)));
      if (e <= s) continue;
      let arr = cover.get(i); if (!arr){ arr = new Array(L).fill(0); cover.set(i, arr); }
      for (let k = s; k < e; k++) arr[k] = 1;
    }
  }));
  return cover;
}
function chapterXhtml(d, m, anns, opts, figs){
  figs = (figs || []).slice();
  const figHtml = f => '<div class="figpage"><img src="' + f.href + '" alt="Page ' + f.page + ' of the original PDF"/><p class="caption">Page ' + f.page + " of the original</p></div>";
  const out = [];
  out.push("<h1>" + xesc(d.title || "Untitled") + "</h1>");
  if (d.authors && d.authors.length) out.push('<p class="meta">' + xesc(fullAuthors(d.authors)) + "</p>");
  const pub = [venue(d), d.year].filter(Boolean).join(", ");
  if (pub) out.push('<p class="meta"><i>' + xesc(pub) + "</i></p>");
  if (d.identifiers && d.identifiers.doi) out.push('<p class="meta">DOI ' + xesc(d.identifiers.doi) + "</p>");
  const hls = anns.filter(a => a.type === "highlight");
  if (m && m.paras.length){
    const cover = opts.marks ? coverMap(m, hls) : new Map();
    const itemHtml = i => {
      const text = disp(m.items[i]); const arr = cover.get(i);
      if (!arr) return xesc(text);
      let h = "", k = 0;
      while (k < text.length){ const on = arr[k] || 0; let j = k; while (j < text.length && (arr[j] || 0) === on) j++; const chunk = xesc(text.slice(k, j)); h += on ? '<span class="hl">' + chunk + "</span>" : chunk; k = j; }
      return h;
    };
    m.paras.forEach(p => {
      const first = p.t.find(t => t !== " ");
      const startPage = first !== undefined ? m.items[first].p : 0;
      while (figs.length && figs[0].page < startPage) out.push(figHtml(figs.shift()));
      const inner = p.t.map(t => t === " " ? " " : itemHtml(t)).join("").replace(/\s+/g, " ").trim();
      if (!inner) return;
      if (p.k === "h") out.push("<h2>" + inner + "</h2>");
      else out.push(p.k === "s" ? '<p class="small">' + inner + "</p>" : "<p>" + inner + "</p>");
    });
    while (figs.length) out.push(figHtml(figs.shift()));
  } else {
    if (d.abstract) out.push("<h2>Abstract</h2>", "<p>" + xesc(d.abstract) + "</p>");
    out.push('<p class="note">' + (d.file_attached ? "The PDF’s text couldn’t be read, so only the details are included." : "This paper has no PDF in Mendeley, so only the details are included.") + "</p>");
  }
  if (opts.notes){
    const notes = anns.filter(a => a.type === "note" && a.text).map(a => stripHtml(a.text)).filter(Boolean);
    const marks = anns.filter(a => a.type === "highlight" || a.type === "sticky_note").sort((a, b) => {
      const pa = (a.positions && a.positions[0]) || {}, pb = (b.positions && b.positions[0]) || {};
      return (pa.page || 0) - (pb.page || 0) || ((pb.top_left && pb.top_left.y) || 0) - ((pa.top_left && pa.top_left.y) || 0);
    });
    if (notes.length || marks.length){
      out.push("<h2>My highlights and notes</h2>");
      notes.forEach(n => out.push('<p class="mynote">' + xesc(n) + "</p>"));
      marks.forEach(a => {
        const page = a.positions && a.positions[0] && a.positions[0].page;
        const where = page ? "p. " + page + ". " : "";
        if (a.type === "sticky_note") out.push('<p class="mynote">' + xesc(where + "Note: " + stripHtml(a.text || "")) + "</p>");
        else {
          const q = (m ? coverText(m, a.positions) : "") || a._quote || "";
          out.push('<blockquote><p>' + xesc(where) + (q ? "“" + xesc(q) + "”" : "(highlighted passage)") + "</p>" + (a.text ? '<p class="mynote">' + xesc(stripHtml(a.text)) + "</p>" : "") + "</blockquote>");
        }
      });
    }
  }
  return xhtmlDoc(d.title || "Untitled", out.join("\n"));
}
async function buildEpub(docs, bookTitle, opts, onStatus){

        : await listAll("/annotations?limit=200", MT.ann);
      list.forEach(a => { if (!annsByDoc.has(a.document_id)) annsByDoc.set(a.document_id, []); annsByDoc.get(a.document_id).push(a); });

    "body{line-height:1.6;text-align:left;margin:0 0.4em;}\np{margin:0 0 0.9em 0;text-indent:0;text-align:left;}\nh1{font-size:1.35em;line-height:1.3;margin:0 0 0.6em 0;}\nh2{font-size:1.12em;line-height:1.3;margin:1.4em 0 0.6em 0;}\n.meta{margin:0 0 0.3em 0;font-size:0.9em;}\n.small{font-size:0.85em;}\n.note{font-style:italic;}\n.hl{text-decoration:underline;background-color:#e6e6e6;}\nblockquote{margin:0 0 0.9em 0;padding-left:0.8em;border-left:3px solid #888;}\n.mynote{font-style:italic;}\n.figpage{page-break-before:always;page-break-after:always;text-align:center;margin:0;}\n.figpage img{max-width:100%;max-height:95%;height:auto;}\n.caption{font-size:0.8em;text-align:center;margin:0.3em 0 0 0;}\nol{padding-left:1.2em;}\nli{margin-bottom:0.4em;}\n";

    '<item id="nav" href="nav.xhtml" media-type="application/xhtml+xml" properties="nav"/>\n<item id="ncx" href="toc.ncx" media-type="application/x-dtbncx+xml"/>\n<item id="css" href="style.css" media-type="text/css"/>\n' +
    (fontOk ? '<item id="font1" href="fonts/OpenDyslexic-Regular.otf" media-type="application/vnd.ms-opentype"/>\n<item id="font2" href="fonts/OpenDyslexic-Bold.otf" media-type="application/vnd.ms-opentype"/>\n' : "") +
    (multi ? '<item id="title" href="title.xhtml" media-type="application/xhtml+xml"/>\n' : "") +
    images.map((h, k) => '<item id="img' + (k + 1) + '" href="' + h + '" media-type="image/jpeg"/>\n').join("") +
    chapters.map((c, i) => '<item id="ch' + (i + 1) + '" href="' + c.file + '" media-type="application/xhtml+xml"/>').join("\n") +
    '\n</manifest>\n<spine toc="ncx">\n' + (multi ? '<itemref idref="title"/>\n' : "") + chapters.map((c, i) => '<itemref idref="ch' + (i + 1) + '"/>').join("\n") + "\n</spine>\n</package>\n");

function openEbook(docs, bookTitle){
  sheetId = null; sheetMode = "ebook";
  const marks = el("input", { type: "checkbox", checked: true });
  const notes = el("input", { type: "checkbox", checked: true });
  const font = el("input", { type: "checkbox", checked: true });
  const figs = el("input", { type: "checkbox", checked: true });
  const status = el("p", { class: "hint", "aria-live": "polite" });
  const result = el("div", {});
  const lab = (input, text) => el("label", { style: "display:flex;gap:10px;align-items:flex-start;padding:8px 0" }, input, el("span", { text: text }));
  const prep = el("button", { class: "btn", text: "Make e-book" });
  prep.addEventListener("click", async () => {
    prep.disabled = true; result.replaceChildren();
    try {
      const r = await buildEpub(docs, bookTitle, { marks: marks.checked, notes: notes.checked, font: font.checked, figs: figs.checked }, t => status.textContent = t);
      const name = (bookTitle || "papers").normalize("NFD").replace(/[^\w\s-]/g, "").trim().replace(/\s+/g, "-").slice(0, 60).toLowerCase() + ".epub";
      const file = new File([r.blob], name, { type: "application/epub+zip" });
      status.textContent = "Ready. " + (docs.length === 1 ? (r.withText ? "Full text included." : "Only the details could be included.") : r.withText + " of " + docs.length + " papers have full text.") + (figs.checked ? " " + r.figCount + " figure page" + (r.figCount === 1 ? "" : "s") + " added." : "") + (font.checked && !r.fontOk ? " The OpenDyslexic font couldn’t be downloaded, so the e-reader’s own font will be used." : "") + " (" + (file.size / 1048576).toFixed(1) + " MB)";
      const canShare = navigator.canShare && navigator.canShare({ files: [file] });
      setKids(result, el("div", { class: "actions" },
        canShare ? el("button", { class: "btn", text: "Share…", onclick: () => navigator.share({ files: [file], title: bookTitle }).catch(() => {}) }) : null,

function gemError(status, body){
  const msg = (body && body.error && body.error.message) || "";
  if (status === 400 && /api key/i.test(msg)) return "Gemini didn’t accept that API key. Check it in Gemini settings.";
  if (status === 403) return "That API key isn’t allowed to use Gemini here. If you restricted the key, allow the Generative Language API and this website.";
  if (status === 404) return "That Gemini model isn’t available. Pick another one in Gemini settings.";
  if (status === 429) return "Gemini’s usage limit has been reached. Wait a minute and try again.";
  if (status >= 500) return "Gemini is having problems right now. Try again shortly.";
  return "Gemini replied " + status + (msg ? ": " + msg.slice(0, 160) : ".");
}
async function gemFetch(path, init, timeoutMs){
  const g = gem(); if (!g.key) throw new Error("Add your Gemini API key first.");
  const ctl = new AbortController(); const t = setTimeout(() => ctl.abort(), timeoutMs || 30000);
  let res;
  try { res = await fetch(GEM_API + path, Object.assign({}, init, { signal: ctl.signal, headers: Object.assign({ "x-goog-api-key": g.key }, (init && init.headers) || {}) })); }
  catch (e) { throw new Error(e.name === "AbortError" ? "Gemini took too long to answer. Try again." : "Couldn’t reach Gemini. Check your connection."); }
  finally { clearTimeout(t); }
  let body = null; try { body = await res.json(); } catch (e) {}
  if (!res.ok){ const err = new Error(gemError(res.status, body)); err.status = res.status; err.raw = (body && body.error && body.error.message) || ""; throw err; }
  return body;
}
async function gemModels(){

    .map(m => m.name.replace(/^models\//, ""))
    .filter(n => /^gemini-/.test(n) && !/(tts|image|live|audio|embedding|robotics|computer-use|learnlm|native)/i.test(n));
  const ver = n => { const m = /gemini-(\d+(?:\.\d+)?)/.exec(n); return m ? parseFloat(m[1]) : 0; };
  const rank = n => ver(n) * 10 + (/flash/.test(n) && !/lite/.test(n) ? 3 : /pro/.test(n) ? 2 : 1) - (/(preview|exp)/.test(n) ? 5 : 0) - (/latest/.test(n) ? 1 : 0);

}
function quizSourceText(m){

async function embModel(){
  const g = gem(); if (g.embModel) return g.embModel;

  try {
    const body = await gemFetch("/models?pageSize=200", { method: "GET" }, 15000);
    const list = (body.models || []).filter(m => (m.supportedGenerationMethods || []).some(x => /embed/i.test(x)))
      .map(m => m.name.replace(/^models\//, "")).filter(n => /gemini-embedding/.test(n) && !/(exp|preview)/.test(n));
    const ver = n => { const m = /(\d+)$/.exec(n); return m ? +m[1] : 0; };

}
async function embedBatch(texts, task, dim, onStatus){
  const model = await embModel();

    ? { model: "models/" + model, content: { parts: [{ text: t }] }, embedContentConfig: { taskType: task, outputDimensionality: dim } }

  const known = gem().embStyle;
  const styles = known ? [known, known === "legacy" ? "config" : "legacy"] : ["legacy", "config"];
  let lastErr = null;
  for (const style of styles){
    for (let attempt = 0; attempt < 6; attempt++){
      try {
        const body = await gemFetch("/models/" + encodeURIComponent(model) + ":batchEmbedContents", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(build(style)) }, 60000);
        const embs = (body && body.embeddings) || [];
        if (embs.length !== texts.length) throw new Error("Gemini returned the wrong number of fingerprints.");
        if (gem().embStyle !== style) lsSet(GEM_KEY, Object.assign(gem(), { embStyle: style }));
        return embs.map(e => vnorm(e.values || []));

}

function chunksOf(m, title){

  const title = norm(d.title), tags = norm([].concat(d.tags || [], d.keywords || []).join(" ")), auth = norm(fullAuthors(d.authors)), abs = norm(d.abstract);
  let s = 0;
  words.forEach(w => { if (title.includes(w)) s += 3; if (tags.includes(w)) s += 2; if (auth.includes(w)) s += 3; if (abs.includes(w)) s += 1; });

  const scores = new Map();
  embs.forEach(e => { const d = S.lib.get(e.id); if (!d) return; scores.set(e.id, { id: e.id, sem: vdot(qv, e.v), chunk: 0, pages: [], kw: keywordScore(d, words) }); });

    const hits = c.c.map(x => ({ p: x.p, s: vdot(q256, x.v) })).sort((a, b) => b.s - a.s);

  ].filter(x => x !== "").join("\n\n");
  const model = gem().model || "gemini-3.6-flash";
  onStatus("Gemini is reading " + read.length + " papers and writing an answer. This usually takes 30 to 90 seconds…");
  const body = await gemFetch("/models/" + encodeURIComponent(model) + ":generateContent", {
    method: "POST", headers: { "content-type": "application/json" },
    body: JSON.stringify({ contents: [{ role: "user", parts: [{ text: prompt }] }], generationConfig: { responseMimeType: "application/json", responseSchema: ASK_SCHEMA, temperature: 0.3 } })
  }, 180000);
  const cand = body && body.candidates && body.candidates[0];
  if (!cand) throw new Error("Gemini didn’t return an answer.");
  const text = ((cand.content && cand.content.parts) || []).filter(p => !p.thought && typeof p.text === "string").map(p => p.text).join("");
  let a; try { a = JSON.parse(text.replace(/^```(?:json)?\s*|\s*```$/g, "")); } catch (e) { throw new Error("Gemini’s answer couldn’t be read. Try again."); }
  const refMap = {}; refs.forEach(r => { refMap[r.ref] = r.id; });
  const result = {
    question: question, prev: prev ? prev.question : null, answer: (a.answer || "").trim(), confidence: a.confidence || "",
    sources: (a.sources || []).filter(s => refMap[String(s.ref).toUpperCase()]).map(s => ({ id: refMap[String(s.ref).toUpperCase()], contribution: s.contribution || "", pages: (s.pages || []).filter(p => p > 0).slice(0, 6) })),
    also: (a.also_relevant || []).filter(s => refMap[String(s.ref).toUpperCase()]).map(s => ({ id: refMap[String(s.ref).toUpperCase()], why: s.why || "" })),
    refMap: refMap, made: Date.now(), model: model
  };
  const hist = (await DB.get("askhist").catch(() => null)) || [];
  hist.unshift(result); await DB.set("askhist", hist.slice(0, 40)).catch(() => {});
  return result;
}
function citeNodes(text, refMap){
  const out = []; const re = /\[([^\]]*?\b[PA]\d+[^\]]*?)\]/g; let last = 0, m;
  while ((m = re.exec(text))){
    if (m.index > last) out.push(text.slice(last, m.index));
    const inner = m[1]; const parts = []; const r2 = /\b([PA]\d+)(?:,\s*pp?\.\s*(\d+))?/g; let x;
    while ((x = r2.exec(inner))){
      const id = refMap[x[1]]; const d = id && S.lib.get(id); if (!d) continue;
      const page = x[2] ? +x[2] : 0;
      parts.push(el("button", { class: "cite", onclick: () => openReaderAt(id, page) }, shortCite(d) + (page ? ", p. " + page : "")));
    }
    if (parts.length){ out.push("("); parts.forEach((p, i) => { if (i) out.push("; "); out.push(p); }); out.push(")"); }
    last = re.lastIndex;
  }
  if (last < text.length) out.push(text.slice(last));
  return out;
}
function openReaderAt(id, page){
  const d = S.lib.get(id); if (!d) return;
  if (!d.file_attached){ openSheet(id); return; }
  R.jumpPage = page || 0; openReader(id);
}

/* ================= Export for Claude ================= */
function coverText(m, positions){
  const segs = [];
  (positions || []).forEach(pos => {
    if (!pos || !pos.top_left || !pos.bottom_right) return;
    const xl = Math.min(pos.top_left.x, pos.bottom_right.x), xr = Math.max(pos.top_left.x, pos.bottom_right.x);
    const yb = Math.min(pos.top_left.y, pos.bottom_right.y), yt = Math.max(pos.top_left.y, pos.bottom_right.y);
    m.items.forEach((it, i) => {
      if (it.p !== pos.page || it.l === undefined) return;
      const ib = it.y - it.h * 0.2, itp = it.y + it.h * 0.8;
      if (Math.min(yt, itp) - Math.max(yb, ib) < it.h * 0.4) return;
      if (xr < it.x || xl > it.x + it.w) return;
      const L = it.s.length, cw = it.w / Math.max(1, L);
      const s = Math.max(0, Math.min(L, Math.round((xl - it.x) / cw))), e = Math.max(0, Math.min(L, Math.round((xr - it.x) / cw)));
      if (e > s) segs.push({ i: i, t: disp(it).slice(s, e) });
    });
  });
  segs.sort((a, b) => a.i - b.i);
  return segs.map(x => x.t).join(" ").replace(/\s+/g, " ").trim();
}
function modelText(m){
  return m.paras.map(p => {
    const t = p.t.map(x => x === " " ? " " : disp(m.items[x])).join("").replace(/\s+/g, " ").trim();
    return p.k === "h" ? "#### " + t : t;
  }).filter(Boolean).join("\n\n");
}
async function buildExport(docs, incAnn, incText, onStatus){
  const annsByDoc = new Map();
  if (incAnn && tokenValid()){
    onStatus("Fetching highlights and notes from Mendeley…");
    try {
      const all = await listAll("/annotations?limit=200", MT.ann, n => onStatus("Fetching highlights and notes… " + n));
      all.forEach(a => { if (!a.document_id) return; let l = annsByDoc.get(a.document_id); if (!l){ l = []; annsByDoc.set(a.document_id, l); } l.push(a); });
    } catch (e) { if (e.code === "auth") throw e; }
  }
  const folderNames = new Map();
  S.folders.forEach(f => (S.members[f.id] || []).forEach(id => { let l = folderNames.get(id); if (!l){ l = []; folderNames.set(id, l); } l.push(f.name); }));
  const out = ["# My Mendeley library", "", "Exported " + new Date().toLocaleDateString("en-GB", { day: "numeric", month: "long", year: "numeric" }) + ". " + docs.length + (docs.length === 1 ? " paper." : " papers."), ""];
  let withText = 0, withHl = 0;
  for (let k = 0; k < docs.length; k++){
    const d = docs[k];
    if (k % 20 === 0) onStatus("Writing paper " + (k + 1) + " of " + docs.length + "…");
    out.push("## " + (d.title || "Untitled"), "");
    const meta = [];
    if (d.authors && d.authors.length) meta.push("Authors: " + fullAuthors(d.authors));
    if (d.year) meta.push("Year: " + d.year);
    if (venue(d)) meta.push("Published in: " + venue(d));
    if (d.type) meta.push("Type: " + d.type.replace(/_/g, " "));
    const ids = d.identifiers || {};
    if (ids.doi) meta.push("DOI: " + ids.doi);
    if (ids.isbn) meta.push("ISBN: " + ids.isbn);
    if (d.tags && d.tags.length) meta.push("Tags: " + d.tags.join(", "));
    if (folderNames.get(d.id)) meta.push("Folders: " + folderNames.get(d.id).join(", "));
    meta.push("Status: " + (d.read ? "read" : "unread") + (d.starred ? ", starred" : ""));
    meta.forEach(x => out.push("- " + x)); out.push("");
    if (d.abstract) out.push("### Abstract", "", d.abstract.trim(), "");
    let model = null, cachedAnns = null;
    try {
      const fs = await DB.get("files:" + d.id); const f = pickPdf(fs);
      if (f) model = await DB.get("txt:" + f.id);
      cachedAnns = await DB.get("ann:" + d.id);
    } catch (e) {}
    const anns = annsByDoc.get(d.id) || [];
    const notes = anns.filter(a => a.type === "note" && a.text).map(a => stripHtml(a.text)).filter(Boolean);
    if (notes.length) out.push("### My notes", "", notes.join("\n\n"), "");
    const quotes = new Map((cachedAnns || []).map(a => [a.id, a._quote]));
    const hls = anns.filter(a => a.type === "highlight" || a.type === "sticky_note").sort((a, b) => {
      const pa = (a.positions && a.positions[0]) || {}, pb = (b.positions && b.positions[0]) || {};
      return (pa.page || 0) - (pb.page || 0) || ((pb.top_left && pb.top_left.y) || 0) - ((pa.top_left && pa.top_left.y) || 0);
    });
    if (hls.length){
      withHl++;
      out.push("### My highlights", "");
      hls.forEach(a => {
        const page = a.positions && a.positions[0] && a.positions[0].page;
        const where = page ? "p. " + page + ": " : "";
        if (a.type === "sticky_note") out.push("- " + where + "Note: " + stripHtml(a.text || ""));
        else {
          const q = quotes.get(a.id) || (model ? coverText(model, a.positions) : "");
          out.push("- " + where + (q ? "“" + q + "”" : "(highlighted passage; open the paper once in the reader to include its text)"));
          if (a.text) out.push("  Note: " + stripHtml(a.text));
        }
      });
      out.push("");
    }
    if (incText && model){ withText++; out.push("### Full text", "", modelText(model), ""); }
    out.push("---", "");
  }
  return { text: out.join("\n"), withText: withText, withHl: withHl };
}
function openExport(){
  sheetId = null; sheetMode = "export";
  const viewDocs = visible(), allDocs = Array.from(S.lib.values());
  const scopeAll = el("input", { type: "radio", name: "exscope", checked: true });
  const scopeView = el("input", { type: "radio", name: "exscope" });
  const incAnn = el("input", { type: "checkbox", checked: true });

      const canShare = navigator.canShare && navigator.canShare({ files: [file] });
      setKids(result,
        el("div", { class: "actions" },

          el("button", { class: canShare ? "btn line" : "btn", text: "Save to Files", onclick: () => {
            const url = URL.createObjectURL(file); const a = document.createElement("a");
            a.href = url; a.download = name; document.body.append(a); a.click(); a.remove();
            setTimeout(() => URL.revokeObjectURL(url), 60000);
          }})));
    } catch (e) {
      status.textContent = e.code === "auth" ? "Sign in again, then try once more." : "Export failed: " + e.message;
    }
    prep.disabled = false;
  });
  $("#sheetRight").replaceChildren();
  setKids($("#sheetBody"),
    el("h2", { text: "Export for Claude" }),
    el("p", { text: "Makes one file with your papers’ details, abstracts, notes, highlights and full text, ready to add to a Claude project so Claude can work across your whole library." }),
    el("div", { class: "section" }, el("h3", { text: "Which papers" }),
      lab(scopeAll, "Whole library (" + allDocs.length + ")"),
      lab(scopeView, "Only the current list on screen (" + viewDocs.length + ")")),
    el("div", { class: "section" }, el("h3", { text: "Include" }),
      lab(incAnn, "Highlights and notes"),
      lab(incText, "Full text of papers saved on this phone")),
    el("p", { class: "hint", text: "Full text and highlighted passages come from papers you’ve opened in the reader at least once, since those are the ones saved on this phone." }),
    el("div", { class: "actions" }, prep),
    status, result);
  $("#sheet").classList.add("open"); $("#sheet").scrollTop = 0;
}

async function start(){

    const docs = await DB.all(); (docs || []).forEach(d => S.lib.set(d.id, d));
    S.folders = (await DB.get("folders")) || []; S.members = (await DB.get("members")) || {};
  } catch (e) {}
  render();

    let tried = false; try { tried = sessionStorage.getItem("mfe-auto") === "1"; sessionStorage.setItem("mfe-auto", "1"); } catch (e) { tried = true; }

  }
  if (tokenValid()) sync();
}

})();
