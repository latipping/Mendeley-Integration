<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#E9EDF1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#11161C" media="(prefers-color-scheme: dark)">
<title>Papers for Mendeley</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<style>
@font-face{font-family:"OpenDyslexic";font-style:normal;font-weight:400;font-display:swap;src:url("https://cdn.jsdelivr.net/npm/@fontsource/opendyslexic@5.3.0/files/opendyslexic-latin-400-normal.woff2") format("woff2")}
@font-face{font-family:"OpenDyslexic";font-style:normal;font-weight:700;font-display:swap;src:url("https://cdn.jsdelivr.net/npm/@fontsource/opendyslexic@5.3.0/files/opendyslexic-latin-700-normal.woff2") format("woff2")}
:root{
  --bg:#E9EDF1; --surface:#F8FAFB; --ink:#18202B; --muted:#5B6676; --line:#CCD4DD;
  --accent:#4338A8; --accent-ink:#FFFFFF; --accent-soft:#E3E0F7; --star:#B7791F; --danger:#B42318; --warn-bg:#FFF4D6; --warn-ink:#6B4A00;
  --serif:"Source Serif 4", "Iowan Old Style", Georgia, "Times New Roman", serif;
  --sans:"Instrument Sans", -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  color-scheme:light; box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#11161C; --surface:#1A2129; --ink:#E6EBF0; --muted:#95A1AF; --line:#2C3640;
    --accent:#A39BF4; --accent-ink:#11161C; --accent-soft:#2A2747; --star:#E0B04A; --danger:#F97066; --warn-bg:#3A2F12; --warn-ink:#F5D58A;
    color-scheme:dark;
  }
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
a{color:var(--accent)}
.wrap{max-width:720px;margin:0 auto;padding:0 16px 48px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:14px 0 10px}
.top-row{display:flex;align-items:flex-end;justify-content:space-between;gap:10px}
h1{font-family:var(--serif);font-weight:600;font-size:2.1rem;line-height:1;margin:0;letter-spacing:-.01em}
.status{font-size:.86rem;color:var(--muted);margin-top:5px;min-height:1.2em}
.status button{border:0;background:none;color:var(--accent);padding:0;font-size:inherit;text-decoration:underline}
.btn{border:0;border-radius:999px;padding:10px 16px;background:var(--accent);color:var(--accent-ink);font-weight:600;font-size:.95rem;white-space:nowrap}
.btn.line{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.quiet{background:transparent;color:var(--accent);padding:8px 10px}
.btn.danger{background:transparent;color:var(--danger);border:1px solid var(--line)}
.btn.danger.armed{background:var(--danger);color:#fff;border-color:var(--danger)}
.btn.small{padding:7px 12px;font-size:.86rem}
.btn:disabled{opacity:.5;cursor:default}
.icon{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--surface);font-size:1.2rem;line-height:1}
.search{margin-top:12px;width:100%;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:11px 14px;font-size:16px}
.filters{display:flex;gap:8px;margin-top:10px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.filters::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:transparent;border-radius:999px;padding:6px 12px;font-size:.88rem;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.selects{display:flex;gap:8px;margin-top:8px}
.selects select{flex:1;min-width:0;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:7px 10px;font-size:.88rem;color:var(--muted)}
.banner{background:var(--warn-bg);color:var(--warn-ink);border-radius:12px;padding:10px 14px;margin:10px 0 0;font-size:.9rem;display:flex;gap:10px;align-items:center;justify-content:space-between}
.list{list-style:none;margin:8px 0 0;padding:0}
.row{display:grid;grid-template-columns:3.6rem 1fr;gap:12px;padding:14px 0;border-top:1px solid var(--line);cursor:pointer}
.row:first-child{border-top:0}
.year{font-family:var(--serif);font-size:1.45rem;line-height:1.1;color:var(--accent);font-variant-numeric:tabular-nums oldstyle-nums;padding-top:2px}
.year.nd{font-size:.95rem;color:var(--muted);padding-top:6px}
.title{font-family:var(--serif);font-size:1.07rem;line-height:1.3;font-weight:600;margin:0}
.row.unread .title::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--accent);margin-right:7px;vertical-align:.12em}
.authors{font-size:.9rem;margin-top:3px}
.venue{font-family:var(--serif);font-style:italic;font-size:.9rem;color:var(--muted)}
.marks{display:flex;gap:10px;margin-top:5px;font-size:.8rem;color:var(--muted);align-items:center}
.marks .star{color:var(--star)}
.marks .pdf{border:1px solid var(--line);border-radius:4px;padding:0 5px;font-weight:600;font-size:.72rem}
.marks .pending{color:var(--accent)}
.more{display:block;margin:16px auto}
.panel{padding:28px 2px;max-width:36rem}
.panel h2{font-family:var(--serif);font-size:1.5rem;margin:0 0 10px;line-height:1.2}
.panel ol{padding-left:1.2rem;color:var(--muted)}
.panel li{margin-bottom:8px}
.panel code,.mono{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;font-size:.85rem;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:2px 6px;word-break:break-all}
.field{display:block;margin:14px 0}
.field span{display:block;font-size:.85rem;color:var(--muted);margin-bottom:4px}
.field input,.field textarea,.field select{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px;font-size:16px}
.sheet{position:fixed;inset:0;z-index:20;background:var(--surface);overflow-y:auto;-webkit-overflow-scrolling:touch;display:none;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.sheet.open{display:block;animation:rise .22s ease-out}
@keyframes rise{from{transform:translateY(24px);opacity:0}to{transform:none;opacity:1}}
.sheet-bar{position:sticky;top:0;display:flex;justify-content:space-between;align-items:center;padding:8px;background:var(--surface);border-bottom:1px solid var(--line);z-index:2}
.sheet-body{max-width:640px;margin:0 auto;padding:18px 18px 48px}
.sheet h2{font-family:var(--serif);font-size:1.5rem;line-height:1.2;margin:4px 0 10px;font-weight:600}
.meta{font-size:.95rem;margin:0 0 4px}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin:18px 0}
.section{margin-top:24px}
.section h3{font-size:.85rem;font-weight:600;color:var(--muted);margin:0 0 8px}
.abstract{font-family:var(--serif);font-size:1rem;line-height:1.6;margin:0;max-width:36em}
.tags{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.tag{display:inline-flex;align-items:center;gap:4px;background:var(--accent-soft);border-radius:6px;padding:3px 4px 3px 8px;font-size:.85rem}
.tag button{border:0;background:none;color:var(--muted);font-size:1rem;line-height:1;padding:0 4px}
.tag-in{border:1px dashed var(--line);background:transparent;border-radius:6px;padding:4px 8px;font-size:16px;width:9rem}
.folders label{display:flex;gap:10px;align-items:center;padding:7px 0;border-top:1px solid var(--line)}
.folders label:first-child{border-top:0}
.folders input{width:20px;height:20px;accent-color:var(--accent)}
textarea{width:100%;min-height:120px;border:1px solid var(--line);border-radius:10px;background:var(--bg);padding:10px 12px;font-size:16px;line-height:1.5;resize:vertical}
.hint{font-size:.82rem;color:var(--muted);margin:6px 0 0}
.doi{word-break:break-all}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 20px);transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:.9rem;z-index:50;max-width:calc(100% - 32px);display:none}
.toast.show{display:block}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (prefers-reduced-motion: reduce){.sheet.open{animation:none}}

/* ---------- Text reader ---------- */
.rd{position:fixed;inset:0;z-index:40;display:none;flex-direction:column;
  --rd-bg:#FAF4E4;--rd-ink:#2A2620;--rd-muted:#7A715F;--rd-line:#E4DAC2;--rd-bar:#F2EAD4;--rd-accent:#4338A8;--rd-hl-a:.75;
  background:var(--rd-bg);color:var(--rd-ink)}
.rd.open{display:flex}
.rd[data-theme="white"]{--rd-bg:#FFFFFF;--rd-ink:#1E1E1E;--rd-muted:#6B6B6B;--rd-line:#E2E2E2;--rd-bar:#F4F4F4;--rd-accent:#4338A8;--rd-hl-a:.75}
.rd[data-theme="dark"]{--rd-bg:#16191D;--rd-ink:#E2E4E6;--rd-muted:#9AA3AD;--rd-line:#2C3238;--rd-bar:#1E2227;--rd-accent:#A39BF4;--rd-hl-a:.32}
.rd-top{position:relative;z-index:5;flex:none;display:flex;align-items:center;gap:4px;padding:calc(env(safe-area-inset-top,0px) + 6px) 6px 6px;background:var(--rd-bar);border-bottom:1px solid var(--rd-line)}
.rd-tb{border:0;background:none;color:var(--rd-accent);font-weight:600;font-size:.95rem;padding:8px 10px;border-radius:8px;flex:none}
.rd-tb[aria-expanded="true"]{background:var(--rd-line)}
.rd-title{flex:1;min-width:0;font-family:var(--serif);font-size:.92rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--rd-muted);text-align:center}
.rd-prog{flex:none;height:3px;background:var(--rd-line)}
.rd-prog div{height:100%;width:0;background:var(--rd-accent)}
.rd-set{flex:none;background:var(--rd-bar);border-bottom:1px solid var(--rd-line);padding:10px 14px 14px}
.rd-set .grp{display:flex;align-items:center;gap:8px;margin-top:8px;flex-wrap:wrap}
.rd-set .lab{font-size:.82rem;color:var(--rd-muted);width:5.5rem;flex:none}
.rd-opt{border:1px solid var(--rd-line);background:var(--rd-bg);color:var(--rd-ink);border-radius:999px;padding:6px 12px;font-size:.88rem}
.rd-opt[aria-pressed="true"]{background:var(--rd-ink);color:var(--rd-bg);border-color:var(--rd-ink)}
.rd-scroll{flex:1;overflow-y:auto}
.rd-text{max-width:34em;margin:0 auto;padding:22px 20px calc(env(safe-area-inset-bottom,0px) + 140px);font-size:var(--rd-size,19px);line-height:var(--rd-lh,1.7);text-align:left;-webkit-user-select:text;user-select:text;overflow-wrap:break-word}
.rd[data-font="dyslexic"] .rd-text{font-family:"OpenDyslexic", var(--sans);letter-spacing:.01em;word-spacing:.12em}
.rd[data-font="standard"] .rd-text{font-family:var(--sans)}
.rd-text p{margin:0 0 1.1em}
.rd-text h3{font-size:1.15em;line-height:1.35;margin:1.6em 0 .7em;font-weight:700}
.rd-text .rd-small{font-size:.82em;color:var(--rd-muted)}
.rd-text mark{background:rgba(var(--hl),var(--rd-hl-a));color:inherit;border-radius:2px;padding:0;cursor:pointer}
.rd-sticky{border:0;background:rgba(var(--hl),.9);color:#1E1E1E;border-radius:6px;font-size:.75em;line-height:1;padding:3px 5px;margin:0 3px;vertical-align:.1em;cursor:pointer}
.rd-msg{color:var(--rd-muted);text-align:center;margin-top:3em}
.rd-msg-box{text-align:left;max-width:30em;margin:2em auto;font-family:var(--sans);font-size:1rem;line-height:1.5}
.rd-msg-box ol{padding-left:1.2rem}
.rd-bar{position:absolute;left:50%;transform:translateX(-50%);top:calc(100% + 8px);display:flex;flex-wrap:nowrap;align-items:center;justify-content:center;gap:8px;white-space:nowrap;background:var(--rd-ink);color:var(--rd-bg);border-radius:16px;padding:10px 12px;box-shadow:0 6px 20px rgba(0,0,0,.28);z-index:6}
.rd-title.hint{color:var(--rd-accent);font-family:var(--sans);font-weight:600}
.rd-bar .nb.warn{color:#FFB4A8}
.rd-tb[aria-pressed="true"]{background:var(--rd-accent);color:var(--rd-bg)}
.rd.tapmode .rd-text{cursor:pointer}
::highlight(rd-pre){background-color:rgba(67,56,168,.30)}
::highlight(rd-pre-dark){background-color:rgba(163,155,244,.45)}
.rd-text ::selection{background:rgba(67,56,168,.30)}
.li-row{display:flex;gap:10px;align-items:flex-start}
.li-main{flex:1;min-width:0}
.rd-dot{width:34px;height:34px;border-radius:50%;border:2px solid rgba(255,255,255,.6);background:rgb(var(--hl));flex:none}
.rd-bar .nb{border:0;background:none;color:var(--rd-bg);font-weight:600;font-size:.9rem;padding:6px 6px 6px 4px}
.rd-panel{position:absolute;left:0;right:0;bottom:0;max-height:78%;overflow-y:auto;background:var(--rd-bar);color:var(--rd-ink);border-top:1px solid var(--rd-line);border-radius:16px 16px 0 0;padding:14px 18px calc(env(safe-area-inset-bottom,0px) + 18px);z-index:4;box-shadow:0 -6px 24px rgba(0,0,0,.18);font-family:var(--sans)}
.rd-panel h4{margin:0 0 10px;font-size:1rem}
.rd-panel blockquote{margin:0 0 12px;padding:6px 10px;border-left:4px solid rgb(var(--hl,255,245,173));background:var(--rd-bg);border-radius:4px;font-size:.95rem;line-height:1.5}
.rd-panel textarea{background:var(--rd-bg);color:var(--rd-ink);border-color:var(--rd-line);min-height:100px}
.rd-panel .row2{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;align-items:center}
.rd-panel .dots{display:flex;gap:10px;margin-bottom:12px}
.rd-panel .rd-dot{border-color:var(--rd-line)}
.rd-panel .rd-dot[aria-pressed="true"]{border-color:var(--rd-ink);box-shadow:0 0 0 2px var(--rd-bar) inset}
.rd-list{list-style:none;margin:0;padding:0}
.rd-list li{padding:10px 0;border-top:1px solid var(--rd-line);cursor:pointer;font-size:.92rem;line-height:1.45}
.rd-list li:first-child{border-top:0}
.rd-list .q{border-left:4px solid rgb(var(--hl));padding-left:8px}
.rd-list .n{color:var(--rd-muted);margin-top:4px;padding-left:12px}
.rd .btn{background:var(--rd-accent);color:var(--rd-bg)}
.rd .btn.line{background:transparent;color:var(--rd-ink);border-color:var(--rd-line)}
.rd .btn.danger{background:transparent;color:var(--danger);border-color:var(--rd-line)}
.rd .btn.danger.armed{background:var(--danger);color:#fff}
.flash{animation:flash 1.4s ease-out}
@keyframes flash{0%{outline:3px solid var(--rd-accent)}100%{outline:3px solid transparent}}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<input type="file" id="pdfIn" accept="application/pdf,.pdf" class="sr" aria-hidden="true" tabindex="-1">
<input type="file" id="newPdfIn" accept="application/pdf,.pdf" class="sr" aria-hidden="true" tabindex="-1">
<section class="sheet" id="sheet" role="dialog" aria-modal="true">
  <div class="sheet-bar"><button class="btn quiet" id="sheetClose">Library</button><div id="sheetRight"></div></div>
  <div class="sheet-body" id="sheetBody"></div>
</section>
<section class="rd" id="rd" role="dialog" aria-modal="true" aria-label="Reader">
  <div class="rd-top">
    <button class="rd-tb" id="rdClose">Done</button>
    <div class="rd-title" id="rdTitle"></div>
    <button class="rd-tb" id="rdTapBtn" aria-pressed="false">Highlight</button>
    <button class="rd-tb" id="rdNotesBtn" aria-pressed="false">Notes</button>
    <button class="rd-tb" id="rdSetBtn" aria-expanded="false" aria-label="Reading settings">Aa</button>
    <div class="rd-bar" id="rdBar" hidden></div>
  </div>
  <div class="rd-prog"><div id="rdProg"></div></div>
  <div class="rd-set" id="rdSet" hidden></div>
  <div class="rd-scroll" id="rdScroll"><article class="rd-text" id="rdText"></article></div>
  <div class="rd-panel" id="rdPanel" hidden></div>
  <input type="file" id="rdPick" accept="application/pdf,.pdf" class="sr" aria-hidden="true" tabindex="-1">
</section>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(function(){
"use strict";

/* ================= Settings ================= */
// Optional: paste your Mendeley app ID here to skip the setup screen.
const BUILT_IN_CLIENT_ID = "";

const API = "https://api.mendeley.com";
const MT = {
  doc: "application/vnd.mendeley-document.1+json",
  folder: "application/vnd.mendeley-folder.1+json",
  ann: "application/vnd.mendeley-annotation.1+json",
  file: "application/vnd.mendeley-file.1+json"
};
const K = { cfg: "mfe-config", tok: "mfe-token", meta: "mfe-meta", out: "mfe-outbox", view: "mfe-view" };

/* ================= Helpers ================= */
const $ = (s, r) => (r || document).querySelector(s);
function el(tag, attrs, ...kids){
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})){
    if (v === null || v === undefined || v === false) continue;
    if (k === "class") n.className = v;
    else if (k === "text") n.textContent = v;
    else if (k.startsWith("on")) n.addEventListener(k.slice(2), v);
    else n.setAttribute(k, v === true ? "" : v);
  }
  for (const c of kids){ if (c === null || c === undefined || c === false) continue; n.append(c.nodeType ? c : document.createTextNode(String(c))); }
  return n;
}
function lsGet(k, d){ try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } }
function lsSet(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
let toastTimer;
function toast(msg, ms){ const t = $("#toast"); t.textContent = msg; t.classList.add("show"); clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove("show"), ms || 3500); }
function norm(s){ return (s || "").normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase().replace(/[^a-z0-9]+/g, " ").trim(); }
function rand(){ const a = new Uint8Array(16); crypto.getRandomValues(a); return Array.from(a, b => b.toString(16).padStart(2, "0")).join(""); }
function stripHtml(s){ const d = document.createElement("div"); d.innerHTML = (s || "").replace(/<br\s*\/?>/gi, "\n").replace(/<\/p>/gi, "\n"); return (d.textContent || "").trim(); }
function ago(t){
  if (!t) return "never";
  const s = (Date.now() - t) / 1000;
  if (s < 60) return "just now"; if (s < 3600) return Math.floor(s / 60) + " min ago";
  if (s < 86400) return Math.floor(s / 3600) + " h ago";
  return new Date(t).toLocaleDateString("en-GB", { day: "numeric", month: "short" });
}
function asciiName(n){ return (n || "file.pdf").normalize("NFD").replace(/[^\x20-\x7E]/g, "").replace(/["\\]/g, "") || "file.pdf"; }

/* ================= Local cache (IndexedDB) ================= */
const DB = {
  db: null,
  open(){
    return new Promise((res, rej) => {
      let r; try { r = indexedDB.open("mendeley-front", 1); } catch (e) { return rej(e); }
      r.onupgradeneeded = () => { const d = r.result; d.createObjectStore("docs", { keyPath: "id" }); d.createObjectStore("kv"); };
      r.onsuccess = () => { this.db = r.result; res(); }; r.onerror = () => rej(r.error);
    });
  },
  tx(store, mode, fn){
    return new Promise((res, rej) => {
      if (!this.db) return res(undefined);
      const t = this.db.transaction(store, mode); let out; const req = fn(t.objectStore(store));
      if (req) req.onsuccess = () => { out = req.result; };
      t.oncomplete = () => res(out); t.onerror = () => rej(t.error); t.onabort = () => rej(t.error);
    });
  },
  all(){ return this.tx("docs", "readonly", s => s.getAll()); },
  put(d){ return this.tx("docs", "readwrite", s => s.put(d)); },
  del(id){ return this.tx("docs", "readwrite", s => s.delete(id)); },
  replaceAll(arr){ return this.tx("docs", "readwrite", s => { s.clear(); arr.forEach(d => s.put(d)); }); },
  get(k){ return this.tx("kv", "readonly", s => s.get(k)); },
  set(k, v){ return this.tx("kv", "readwrite", s => s.put(v, k)); },
  clear(){ return Promise.all([this.tx("docs", "readwrite", s => s.clear()), this.tx("kv", "readwrite", s => s.clear())]); }
};

/* ================= State ================= */
const S = {
  cfg: lsGet(K.cfg, {}),
  tok: lsGet(K.tok, null),

  view: Object.assign({ q: "", f: "all", folder: "", tag: "", sort: "modified", shown: 150 }, lsGet(K.view, {})),
  syncing: false, lastError: "", authNeeded: false
};
S.view.q = ""; S.view.shown = 150;
const clientId = () => BUILT_IN_CLIENT_ID || S.cfg.clientId || "";
const redirectUri = () => location.origin + location.pathname;
const tokenValid = () => S.tok && S.tok.token && S.tok.exp > Date.now() + 30000;
function saveMeta(){ lsSet(K.meta, S.meta); }
function saveOutbox(){ lsSet(K.out, S.outbox); }
function saveView(){ lsSet(K.view, { f: S.view.f, folder: S.view.folder, tag: S.view.tag, sort: S.view.sort }); }

/* ================= OAuth (implicit flow) ================= */
function signIn(){
  if (!clientId()) return render();
  const st = rand();
  try { sessionStorage.setItem("mfe-state", st); } catch (e) {}
  const q = new URLSearchParams({ client_id: clientId(), redirect_uri: redirectUri(), response_type: "token", scope: "all", state: st });
  location.href = API + "/oauth/authorize?" + q.toString();
}
function handleRedirect(){
  const h = location.hash.startsWith("#") ? new URLSearchParams(location.hash.slice(1)) : null;
  const q = new URLSearchParams(location.search);
  let expected = null; try { expected = sessionStorage.getItem("mfe-state"); } catch (e) {}
  if (h && h.get("access_token")){
    if (expected && h.get("state") !== expected){ S.lastError = "Sign-in reply didn’t match this browser. Try signing in again."; }
    else {
      S.tok = { token: h.get("access_token"), exp: Date.now() + (Number(h.get("expires_in")) || 3600) * 1000 };
      lsSet(K.tok, S.tok); S.meta.everSignedIn = true; saveMeta();
    }
    try { sessionStorage.removeItem("mfe-state"); sessionStorage.removeItem("mfe-auto"); } catch (e) {}
    history.replaceState(null, "", location.pathname);
  } else if (q.get("error") || (h && h.get("error"))){
    const err = q.get("error_description") || q.get("error") || (h && (h.get("error_description") || h.get("error")));
    S.lastError = "Mendeley refused sign-in: " + err + ". Check that the redirect URL registered for your app is exactly " + redirectUri();
    history.replaceState(null, "", location.pathname);
  }
}
function signOut(){
  S.tok = null; localStorage.removeItem(K.tok); localStorage.removeItem(K.meta); localStorage.removeItem(K.out);
  S.meta = {}; S.outbox = []; S.lib = new Map(); S.folders = []; S.members = {};
  DB.clear().catch(() => {}); closeSheet(); render();
}

/* ================= API ================= */
class ApiError extends Error { constructor(code, msg, status){ super(msg); this.code = code; this.status = status; } }
async function api(method, path, opts){
  opts = opts || {};
  if (!tokenValid()){ S.authNeeded = true; throw new ApiError("auth", "Signed out"); }
  const url = (path.startsWith("http") ? path : API + path);
  const full = url + (url.includes("?") ? "&" : "?") + "access_token=" + encodeURIComponent(S.tok.token);
  const headers = Object.assign({}, opts.headers || {});
  if (opts.accept) headers["Accept"] = opts.accept;
  if (opts.type) headers["Content-Type"] = opts.type;
  let res;
  try { res = await fetch(full, { method: method, headers: headers, body: opts.body }); }
  catch (e) { throw new ApiError("network", "Couldn’t reach Mendeley. Check your connection."); }
  if (res.status === 401){ S.tok = null; localStorage.removeItem(K.tok); S.authNeeded = true; throw new ApiError("auth", "Your Mendeley session ended."); }
  if (!res.ok){
    let t = ""; try { t = await res.text(); } catch (e) {}
    let m = t; try { const j = JSON.parse(t); m = j.message || j.error || t; } catch (e) {}
    throw new ApiError(res.status === 429 || res.status >= 500 ? "retry" : "http", m || ("Mendeley replied " + res.status), res.status);
  }
  if (opts.raw) return res;
  if (res.status === 204) return null;
  const txt = await res.text(); return txt ? JSON.parse(txt) : null;
}
function nextLink(res){
  const l = res.headers.get("Link"); if (!l) return null;
  const m = /<([^>]+)>\s*;\s*rel="?next"?/.exec(l); if (!m) return null;
  return m[1].replace(/([?&])access_token=[^&]*&?/, "$1").replace(/[?&]$/, "");
}
async function listAll(path, accept, onPage){
  let out = [], url = path, guard = 0;
  while (url && guard++ < 400){
    const res = await api("GET", url, { accept: accept, raw: true });
    const page = await res.json();
    out = out.concat(page);
    if (onPage) onPage(out.length);
    url = nextLink(res);
  }
  return out;
}

/* ================= Outbox (changes waiting to reach Mendeley) ================= */
function queue(op){
  if (op.t === "patch"){
    const last = S.outbox[S.outbox.length - 1];
    if (last && last.t === "patch" && last.id === op.id){ Object.assign(last.data, op.data); saveOutbox(); return kick(); }
  }
  S.outbox.push(op); saveOutbox(); kick();
}
let flushTimer;
function kick(){ clearTimeout(flushTimer); flushTimer = setTimeout(() => flush().then(render), 600); render(); }
let flushing = false;
async function flush(){
  if (flushing || !S.outbox.length || !tokenValid() || !navigator.onLine) return;
  flushing = true;
  try {
    while (S.outbox.length){
      const op = S.outbox[0];
      try {
        if (op.t === "patch"){
          const d = await api("PATCH", "/documents/" + op.id, { type: MT.doc, accept: MT.doc, body: JSON.stringify(op.data) });
          if (d && d.id){ const cur = S.lib.get(d.id); const merged = Object.assign({}, cur || {}, d); S.lib.set(d.id, merged); DB.put(merged); }
        } else if (op.t === "fadd"){
          await api("POST", "/folders/" + op.f + "/documents", { type: MT.doc, body: JSON.stringify({ id: op.id }) });
        } else if (op.t === "fdel"){
          await api("DELETE", "/folders/" + op.f + "/documents/" + op.id);
        } else if (op.t === "trash"){
          await api("POST", "/documents/" + op.id + "/trash");
        } else if (op.t === "annNew"){
          op.sending = true;
          const a = await api("POST", "/annotations", { type: MT.ann, accept: MT.ann, body: JSON.stringify(op.body) });
          await replaceTempAnn(op.doc, op.tmp, a);
        } else if (op.t === "annPatch"){
          const id = resolveAnnId(op.id);
          if (!String(id).startsWith("tmp-")) await api("PATCH", "/annotations/" + id, { type: MT.ann, accept: MT.ann, body: JSON.stringify(op.data) });
        } else if (op.t === "annDel"){
          const id = resolveAnnId(op.id);
          if (!String(id).startsWith("tmp-")) await api("DELETE", "/annotations/" + id);
        }
        S.outbox.shift(); saveOutbox();
      } catch (e) {
        if (e.code === "auth" || e.code === "network" || e.code === "retry"){ op.sending = false; break; }
        if (e.status === 404 && op.t !== "patch"){ S.outbox.shift(); saveOutbox(); continue; }
        toast("Mendeley rejected a change: " + e.message, 6000);
        if (op.t === "annNew") dropTempAnn(op.doc, op.tmp);
        S.outbox.shift(); saveOutbox();
      }
    }
  } finally { flushing = false; }
}
function pendingFor(id){ return S.outbox.filter(o => o.id === id); }
function overlayPending(doc){
  let d = doc;
  pendingFor(doc.id).forEach(o => { if (o.t === "patch") d = Object.assign({}, d, o.data); });
  return d;
}

/* ================= Sync ================= */
async function sync(opts){
  opts = opts || {};
  if (S.syncing || !tokenValid()) { render(); return; }
  if (!navigator.onLine){ S.lastError = "Offline. Changes will sync when you’re back online."; render(); return; }
  S.syncing = true; S.lastError = ""; render();
  try {
    await flush();
    const startIso = new Date(Date.now() - 5 * 60000).toISOString();
    const full = opts.full || !S.meta.lastModified || Date.now() - (S.meta.lastFullAt || 0) > 24 * 3600000;
    if (full){
      const docs = await listAll("/documents?view=all&limit=500", MT.doc, n => setStatus("Downloading library… " + n));
      const m = new Map(); docs.forEach(d => m.set(d.id, overlayPending(d)));
      S.outbox.forEach(o => { if (o.t === "trash") m.delete(o.id); });
      S.lib = m; await DB.replaceAll(Array.from(m.values()));
      S.meta.lastFullAt = Date.now();
    } else {
      const since = encodeURIComponent(S.meta.lastModified);
      const changed = await listAll("/documents?view=all&limit=500&modified_since=" + since, MT.doc);
      for (const d of changed){ const o = overlayPending(d); S.lib.set(d.id, o); DB.put(o); }
      try {
        const gone = await listAll("/documents?limit=500&deleted_since=" + encodeURIComponent(S.meta.lastDeleted || S.meta.lastModified), MT.doc);
        for (const d of gone){ S.lib.delete(d.id); DB.del(d.id); }
      } catch (e) { if (e.code === "auth" || e.code === "network") throw e; }
    }
    let maxMod = S.meta.lastModified || "";
    S.lib.forEach(d => { if (d.last_modified && d.last_modified > maxMod) maxMod = d.last_modified; });
    S.meta.lastModified = maxMod || startIso; S.meta.lastDeleted = startIso; S.meta.lastSyncAt = Date.now(); saveMeta();
    await syncFolders();
    S.files = {};
  } catch (e) {
    S.lastError = e.code === "auth" ? "" : e.message;
  } finally {
    S.syncing = false; render(); if (sheetId) fillSheet();
  }
}
async function syncFolders(){
  const folders = await listAll("/folders?limit=500", MT.folder);
  S.folders = folders.sort((a, b) => (a.name || "").localeCompare(b.name || "", "en-GB", { sensitivity: "base" }));
  const members = {};
  let i = 0;
  async function worker(){
    while (i < S.folders.length){
      const f = S.folders[i++];
      try { const ds = await listAll("/folders/" + f.id + "/documents?limit=500", MT.doc); members[f.id] = ds.map(d => d.id); }
      catch (e) { if (e.code === "auth") throw e; members[f.id] = S.members[f.id] || []; }
    }
  }
  await Promise.all([worker(), worker(), worker(), worker()]);
  S.outbox.forEach(o => {
    if (o.t === "fadd"){ members[o.f] = members[o.f] || []; if (!members[o.f].includes(o.id)) members[o.f].push(o.id); }
    if (o.t === "fdel" && members[o.f]) members[o.f] = members[o.f].filter(x => x !== o.id);
  });
  S.members = members;
  DB.set("folders", S.folders); DB.set("members", S.members);
}

/* ================= Local edits ================= */
function edit(id, data){
  const d = S.lib.get(id); if (!d) return;
  const n = Object.assign({}, d, data); S.lib.set(id, n); DB.put(n);
  queue({ t: "patch", id: id, data: data });
  if (sheetId === id) fillSheet();
}
function setFolder(fid, id, on){
  const arr = S.members[fid] || (S.members[fid] = []);
  if (on && !arr.includes(id)) arr.push(id);
  if (!on) S.members[fid] = arr.filter(x => x !== id);
  DB.set("members", S.members);
  queue({ t: on ? "fadd" : "fdel", f: fid, id: id });
}
function trash(id){
  S.lib.delete(id); DB.del(id);
  S.outbox = S.outbox.filter(o => !(o.t === "patch" && o.id === id)); saveOutbox();
  queue({ t: "trash", id: id });
}

/* ================= Creating papers (needs a connection) ================= */
const DOC_FIELDS = ["title", "type", "authors", "editors", "year", "month", "day", "source", "volume", "issue", "pages", "identifiers", "abstract", "keywords", "publisher", "city", "edition", "institution", "series", "chapter", "websites", "language"];
async function addByDoi(raw){
  const doi = (raw || "").trim().replace(/^https?:\/\/(dx\.)?doi\.org\//i, "").replace(/^doi:\s*/i, "");
  if (!/^10\.\S+\/\S+/.test(doi)){ toast("That doesn’t look like a DOI. It should start with 10."); return false; }
  toast("Looking up " + doi + "…", 20000);
  let cat = [];
  try { cat = await api("GET", "/catalog?view=bib&doi=" + encodeURIComponent(doi), { accept: MT.doc }); }
  catch (e) { if (e.status !== 404){ toast(e.message, 6000); return false; } }
  const src = (cat && cat[0]) || null;
  if (!src){ toast("Mendeley’s catalogue has no record of that DOI.", 6000); return false; }
  const body = {}; DOC_FIELDS.forEach(k => { if (src[k] !== undefined && src[k] !== null && src[k] !== "") body[k] = src[k]; });
  body.type = body.type || "journal"; body.title = body.title || doi;
  body.identifiers = Object.assign({}, body.identifiers || {}, { doi: doi });
  try {
    const d = await api("POST", "/documents", { type: MT.doc, accept: MT.doc, body: JSON.stringify(body) });
    S.lib.set(d.id, d); DB.put(d);
    if (S.view.folder) setFolder(S.view.folder, d.id, true);
    toast("Added to Mendeley."); render(); return d.id;
  } catch (e) { toast(e.message, 6000); return false; }
}
async function addFromPdf(file){
  toast("Uploading " + file.name + "… Mendeley reads the details from the PDF.", 60000);
  try {
    const d = await api("POST", "/documents", { accept: MT.doc, type: "application/pdf", headers: { "Content-Disposition": 'attachment; filename="' + asciiName(file.name) + '"' }, body: file });
    const full = await api("GET", "/documents/" + d.id + "?view=all", { accept: MT.doc }).catch(() => d);
    S.lib.set(full.id, full); DB.put(full);
    if (S.view.folder) setFolder(S.view.folder, full.id, true);
    toast("Added to Mendeley. Check the details, as automatic extraction isn’t always right.", 6000);
    render(); openSheet(full.id);
  } catch (e) { toast(e.message, 6000); }
}
async function attachPdf(id, file){
  toast("Uploading PDF…", 60000);
  try {
    const f = await api("POST", "/files", { accept: MT.file, type: "application/pdf", headers: { "Content-Disposition": 'attachment; filename="' + asciiName(file.name) + '"', "Link": "<" + API + "/documents/" + id + '>; rel="document"' }, body: file });
    S.files[id] = (S.files[id] || []).concat(f ? [f] : []);
    const d = S.lib.get(id); if (d){ const n = Object.assign({}, d, { file_attached: true }); S.lib.set(id, n); DB.put(n); }
    toast("PDF attached in Mendeley."); render(); if (sheetId === id) fillSheet();
  } catch (e) { toast(e.message, 6000); }
}
async function filesFor(id){
  if (S.files[id]) return S.files[id];
  const fs = await api("GET", "/files?document_id=" + encodeURIComponent(id), { accept: MT.file });
  S.files[id] = fs || []; return S.files[id];
}
async function openPdf(id, win){
  try {
    const fs = await filesFor(id);
    const f = fs.find(x => /pdf/i.test(x.mime_type || "") || /\.pdf$/i.test(x.file_name || "")) || fs[0];
    if (!f){ if (win) win.close(); toast("Mendeley has no file for this paper."); return; }
    if (!tokenValid()) throw new ApiError("auth", "Signed out");
    const url = API + "/files/" + f.id + "?access_token=" + encodeURIComponent(S.tok.token);
    if (win) win.location.href = url; else location.href = url;
    const d = S.lib.get(id); if (d && !d.read) edit(id, { read: true });
  } catch (e) {
    if (win) win.close();
    toast(e.code === "auth" ? "Sign in again to open PDFs." : e.message, 5000); render();
  }
}

/* ================= Notes (Mendeley annotations) ================= */
const notes = {};
async function loadNote(id){
  if (notes[id]) return notes[id];
  const anns = await api("GET", "/annotations?document_id=" + encodeURIComponent(id) + "&limit=200", { accept: MT.ann });
  const n = (anns || []).find(a => a.type === "note");
  notes[id] = n ? { annId: n.id, text: stripHtml(n.text) } : { annId: null, text: "" };
  return notes[id];
}
async function saveNote(id, text){
  const cur = notes[id] || {};
  if (cur.annId){
    await api("PATCH", "/annotations/" + cur.annId, { type: MT.ann, accept: MT.ann, body: JSON.stringify({ text: text }) });
  } else {
    const a = await api("POST", "/annotations", { type: MT.ann, accept: MT.ann, body: JSON.stringify({ type: "note", document_id: id, text: text }) });
    cur.annId = a && a.id;
  }
  notes[id] = { annId: cur.annId, text: text };
}

function setKids(node, ...kids){ node.replaceChildren(...kids.filter(k => k !== null && k !== undefined && k !== false)); }
function cleanDoiInput(v){ return (v || "").trim().replace(/^https?:\/\/(dx\.)?doi\.org\//i, "").replace(/^doi:\s*/i, "").trim(); }
function cleanIsbn(v){ return (v || "").replace(/[^0-9Xx]/g, "").toUpperCase(); }
function lookupKind(v){
  const d = cleanDoiInput(v);
  if (/^10\.\S+\/\S+/.test(d)) return { kind: "doi", value: d };
  const i = cleanIsbn(v);
  if (i.length === 10 || i.length === 13) return { kind: "isbn", value: i };

async function lookupIdentifier(raw){
  const id = lookupKind(raw);
  if (!id) throw new Error("Enter a DOI (starts with 10.) or a 10 or 13 digit ISBN.");
  // 1. Mendeley catalogue
  try {
    const cat = await api("GET", "/catalog?view=bib&" + id.kind + "=" + encodeURIComponent(id.value), { accept: MT.doc });
    if (cat && cat[0] && cat[0].title){
      const c = cat[0]; const out = { source_db: "Mendeley’s catalogue" };
      ["title", "type", "authors", "editors", "year", "source", "volume", "issue", "pages", "abstract", "publisher", "city", "edition", "keywords"].forEach(k => { if (c[k] !== undefined && c[k] !== null && c[k] !== "") out[k] = c[k]; });
      out.identifiers = Object.assign({}, c.identifiers || {}, id.kind === "doi" ? { doi: id.value } : { isbn: id.value });
      return out;
    }
  } catch (e) { if (e.code === "auth") throw e; }
  // 2. Crossref for DOIs
  if (id.kind === "doi"){
    try {
      const r = await fetch("https://api.crossref.org/works/" + encodeURIComponent(id.value).replace(/%2F/gi, "/"));
      if (r.ok){
        const m = (await r.json()).message || {};
        const dp = (m.issued && m.issued["date-parts"] && m.issued["date-parts"][0]) || (m.published && m.published["date-parts"] && m.published["date-parts"][0]) || [];
        const typeMap = { "journal-article": "journal", "book": "book", "book-chapter": "book_section", "proceedings-article": "conference_proceedings", "posted-content": "working_paper", "report": "report", "dissertation": "thesis" };
        const out = { source_db: "Crossref", type: typeMap[m.type] || "journal" };
        if (m.title && m.title[0]) out.title = m.title[0];
        if (m.author) out.authors = m.author.map(a => ({ first_name: a.given || "", last_name: a.family || a.name || "" })).filter(a => a.last_name);
        if (dp[0]) out.year = dp[0];
        const src = (m["container-title"] && m["container-title"][0]) || ""; if (src) out.source = src;
        if (m.volume) out.volume = m.volume; if (m.issue) out.issue = m.issue; if (m.page) out.pages = m.page;
        if (m.publisher) out.publisher = m.publisher;
        if (m.abstract) out.abstract = stripHtml(m.abstract.replace(/<\/?jats:[^>]*>/g, " ")).replace(/\s+/g, " ").trim();
        out.identifiers = { doi: id.value };
        if (m.ISSN && m.ISSN[0]) out.identifiers.issn = m.ISSN[0];
        if (out.title) return out;
      }
    } catch (e) {}
  }
  // 3. Open Library for ISBNs
  if (id.kind === "isbn"){
    try {
      const r = await fetch("https://openlibrary.org/api/books?format=json&jscmd=data&bibkeys=ISBN:" + id.value);
      if (r.ok){
        const b = (await r.json())["ISBN:" + id.value];
        if (b && b.title){
          const out = { source_db: "Open Library", type: "book", title: b.subtitle ? b.title + ": " + b.subtitle : b.title };
          if (b.authors) out.authors = b.authors.map(a => { const p = (a.name || "").trim().split(/\s+/); const last = p.pop() || ""; return { first_name: p.join(" "), last_name: last }; }).filter(a => a.last_name);
          const y = /\d{4}/.exec(b.publish_date || ""); if (y) out.year = Number(y[0]);
          if (b.publishers && b.publishers[0]) out.publisher = b.publishers[0].name;
          if (b.publish_places && b.publish_places[0]) out.city = b.publish_places[0].name;
          if (b.number_of_pages) out.pages = String(b.number_of_pages);
          out.identifiers = { isbn: id.value };
          return out;
        }
      }
    } catch (e) {}
  }
  throw new Error("No record found for that " + (id.kind === "doi" ? "DOI" : "ISBN") + ".");
}
function openLookup(docId){

/* ---------- Getting the PDF ---------- */
function pickPdf(fs){ return (fs || []).find(x => /pdf/i.test(x.mime_type || "") || /\.pdf$/i.test(x.file_name || "")) || null; }
async function fileMetaFor(docId){
  try { const fs = await filesFor(docId); DB.set("files:" + docId, fs); return pickPdf(fs); }
  catch (e) { const fs = await DB.get("files:" + docId).catch(() => null); if (fs && fs.length) return pickPdf(fs); throw e; }
}
async function cachePdf(fid, buf){
  try {
    await DB.set("pdf:" + fid, buf);
    let idx = (await DB.get("pdfIndex")) || []; idx = idx.filter(x => x !== fid); idx.push(fid);
    while (idx.length > 25){ const old = idx.shift(); DB.tx("kv", "readwrite", s => s.delete("pdf:" + old)); DB.tx("kv", "readwrite", s => s.delete("txt:" + old)); }
    await DB.set("pdfIndex", idx);

async function downloadPdf(f){
  if (!tokenValid()) throw new ApiError("auth", "Signed out");
  let res;
  try { res = await fetch(API + "/files/" + f.id + "?access_token=" + encodeURIComponent(S.tok.token)); }
  catch (e) { throw new ApiError("blocked", "Download blocked"); }
  if (res.status === 401){ S.tok = null; localStorage.removeItem(K.tok); throw new ApiError("auth", "Signed out"); }

}
async function sha1Hex(buf){

}
async function loadPdfDoc(buf){
  const lib = window.pdfjsLib;

  lib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

/* ---------- Turning a PDF into readable paragraphs ---------- */
function median(a){ if (!a.length) return 0; const s = a.slice().sort((x, y) => x - y); return s[Math.floor(s.length / 2)]; }
async function extractModel(pdf, onProg){
  const items = [], lines = [];
  for (let n = 1; n <= pdf.numPages; n++){
    if (onProg) onProg(n, pdf.numPages);
    const page = await pdf.getPage(n);
    const view = page.view; const ph = view[3] - view[1], py0 = view[1];
    const tc = await page.getTextContent();
    let cur = null;
    for (const it of tc.items){
      if (typeof it.str !== "string") continue;
      const t = it.transform; const size = Math.hypot(t[2], t[3]) || Math.abs(t[0]) || 10;
      const x = t[4], y = t[5], w = it.width || 0;
      if (!it.str.trim()){
        if (cur && it.str.length) cur.gapFlag = true;
        if (cur && it.hasEOL) cur.eol = true;
        continue;
      }
      const newLine = !cur || cur.eol || Math.abs(y - cur.y) > size * 0.6 || x < cur.x1 - size * 1.5;
      const idx = items.length;
      items.push({ p: n, x: +x.toFixed(2), y: +y.toFixed(2), w: +w.toFixed(2), h: +size.toFixed(2), s: it.str });
      if (newLine){
        cur = { id: lines.length, p: n, y: y, size: size, x0: x, x1: x + w, it: [idx], ph: ph, py0: py0, len: it.str.length };
        lines.push(cur);
      } else {
        const prev = items[cur.it[cur.it.length - 1]];
        const gap = x - (prev.x + prev.w);
        if ((gap > size * 0.12 || cur.gapFlag) && !/\s$/.test(prev.s) && !/^\s/.test(it.str)) cur.it.push(" ");
        cur.it.push(idx); cur.x1 = Math.max(cur.x1, x + w);
        if (it.str.length > cur.len){ cur.size = size; cur.len = it.str.length; }
      }
      cur.gapFlag = false;
      if (it.hasEOL) cur.eol = true;
    }
    page.cleanup();
  }
  const lineText = l => l.it.map(i => i === " " ? " " : items[i].s).join("");
  // Drop running headers, footers and page numbers
  const np = pdf.numPages, keyCount = new Map();
  lines.forEach(l => {
    const rel = (l.y - l.py0) / (l.ph || 1);
    l.edge = rel > 0.92 || rel < 0.07;
    if (l.edge){ l.key = norm(lineText(l)).replace(/\d+/g, "#"); keyCount.set(l.key, (keyCount.get(l.key) || 0) + 1); }
  });
  lines.forEach(l => {
    if (!l.edge) return;
    const t = lineText(l).trim();
    if (/^(page\s*)?[\divxlc]{1,5}(\s*(of|\/)\s*\d+)?$/i.test(t) || (np >= 3 && keyCount.get(l.key) >= Math.max(2, np * 0.4))) l.drop = true;
  });
  const kept = lines.filter(l => !l.drop);
  const sizes = []; kept.forEach(l => { const reps = Math.min(20, Math.ceil(l.len / 10)); for (let k = 0; k < reps; k++) sizes.push(l.size); });
  const body = median(sizes) || 10;
  const gaps = [];
  for (let i = 1; i < kept.length; i++){
    const a = kept[i - 1], b = kept[i];
    if (a.p !== b.p) continue;
    const d = a.y - b.y;
    if (d > 0 && d < 3 * b.size && Math.abs(a.size - b.size) < 0.5) gaps.push(d);
  }
  const lineGap = median(gaps) || body * 1.25;
  const widths = kept.filter(l => Math.abs(l.size - body) < 0.6).map(l => l.x1 - l.x0).sort((a, b) => a - b);
  const colW = widths.length ? widths[Math.floor(widths.length * 0.8)] : 300;
  const kind = l => l.size >= body * 1.15 && lineText(l).length < 160 ? "h" : (l.size < body * 0.88 ? "s" : "p");
  const paras = []; let para = null, prev = null;
  for (const l of kept){
    let brk = !para;
    if (!brk){
      const sizeChange = Math.abs(l.size - prev.size) > Math.max(prev.size, l.size) * 0.12;
      const samePage = l.p === prev.p, d = prev.y - l.y;
      const prevText = lineText(prev).trim();
      const prevEnds = /[.?!:”"’)\]]$/.test(prevText);
      const prevW = prev.x1 - prev.x0;
      if (sizeChange) brk = true;
      else if (samePage && d > 0 && d > lineGap * Math.max(1, l.size / body) * 1.45) brk = true;
      else if (samePage && d > 0 && l.x0 > prev.x0 + l.size * 0.8 && (l.x1 - l.x0) > colW * 0.5 && prevEnds) brk = true;
      else if (prevW < colW * 0.8 && prevEnds) brk = true;
    }
    if (brk){ para = { k: kind(l), t: [] }; paras.push(para); }
    else {
      let lastIdx = -1; for (let k = para.t.length - 1; k >= 0; k--){ if (para.t[k] !== " "){ lastIdx = para.t[k]; break; } }
      const firstIdx = l.it.find(i => i !== " ");
      const li = items[lastIdx];
      if (li && /[a-z]{2}-$/.test(li.s) && /^[a-z]/.test(items[firstIdx].s)) li.dh = 1;
      else if (!(li && /-$/.test(li.s))) para.t.push(" ");
    }
    l.it.forEach(i => { para.t.push(i); if (i !== " ") items[i].l = l.id; });
    prev = l;
  }
  return { v: 2, items: items, paras: paras };
}

async function openReader(docId){

  const gen = ++R.gen;
  R.docId = docId; R.model = null; R.anns = []; R.spanEls = []; R.touched = []; R.file = null;
  R.title = d.title || "Paper"; $("#rdTitle").textContent = R.title; $("#rdTitle").classList.remove("hint");
  applyReaderSettings();

  hidePanel(); R.tapMode = false; $("#rdTapBtn").setAttribute("aria-pressed", "false"); $("#rd").classList.remove("tapmode"); R.lastRange = null; R.tapAnchor = null; clearPreview(); hideBar();
  $("#rdText").replaceChildren(el("p", { class: "rd-msg", text: "Getting the PDF…" }));
  $("#rdProg").style.width = "0";
  $("#rd").classList.add("open"); document.body.style.overflow = "hidden";
  let f;
  try { f = await fileMetaFor(docId); }
  catch (e) { return readerError(e.code === "auth" ? "Sign in again to fetch this paper." : "Couldn’t reach Mendeley to find this paper’s PDF.", false); }
  if (gen !== R.gen) return;
  if (!f) return readerError("Mendeley has no PDF attached to this paper.", false);
  R.file = f;
  let model = await DB.get("txt:" + f.id).catch(() => null);
  if (!model || model.v !== 2){
    let buf = await DB.get("pdf:" + f.id).catch(() => null);
    if (!buf){
      try { buf = await downloadPdf(f); await cachePdf(f.id, buf); }
      catch (e) { if (gen !== R.gen) return; return readerError(e.code === "auth" ? "Sign in again to fetch this paper." : "Mendeley wouldn’t let the app download this PDF directly.", e.code !== "auth"); }
    }
    if (gen !== R.gen) return;
    try { model = await buildModel(buf, f, gen); } catch (e) { return readerError(e.message || "This file couldn’t be read as a PDF.", false); }
    if (!model) return;
  }
  if (gen !== R.gen) return;
  R.model = model;
  renderText();
  if (!d.read) edit(docId, { read: true });
  loadAnns(docId);
}
async function buildModel(buf, f, gen){
  const pdf = await loadPdfDoc(buf);
  const model = await extractModel(pdf, (n, t) => { if (gen === R.gen) $("#rdText").replaceChildren(el("p", { class: "rd-msg", text: "Preparing text… page " + n + " of " + t })); });

}

$("#rdPick").addEventListener("change", async e => {

/* ---------- Highlights and notes ---------- */
async function saveAnns(docId){ try { await DB.set("ann:" + docId, R.docId === docId ? R.anns : ((await DB.get("ann:" + docId)) || [])); } catch (e) {} }
async function loadAnns(docId){
  const cached = (await DB.get("ann:" + docId).catch(() => null)) || [];
  if (R.docId !== docId) return;
  R.anns = cached; paintAnns();
  if (!tokenValid() || !navigator.onLine) return;
  try {
    const server = await listAll("/annotations?document_id=" + encodeURIComponent(docId) + "&limit=200", MT.ann);
    const dels = new Set(S.outbox.filter(o => o.t === "annDel").map(o => resolveAnnId(o.id)));
    const patches = S.outbox.filter(o => o.t === "annPatch");
    const quotes = new Map(cached.map(a => [resolveAnnId(a.id), a._quote]));
    let list = server.filter(a => (a.type === "highlight" || a.type === "sticky_note") && !dels.has(a.id)).map(a => {
      let x = Object.assign({}, a, { _quote: quotes.get(a.id) });
      patches.forEach(p => { if (resolveAnnId(p.id) === a.id) x = Object.assign(x, p.data); });
      return x;
    });
    const pendingNew = S.outbox.filter(o => o.t === "annNew" && o.doc === docId).map(o => Object.assign({ id: o.tmp, _quote: quotes.get(o.tmp) }, o.body));
    list = list.concat(pendingNew);
    if (R.file && R.file.filehash) list = list.filter(a => !a.filehash || a.filehash === R.file.filehash);
    if (R.docId !== docId) return;
    R.anns = list; paintAnns(); saveAnns(docId);
  } catch (e) {}
}
function paintAnns(){
  const m = R.model; if (!m) return;
  R.touched.forEach(i => { const sp = R.spanEls[i]; if (sp) sp.textContent = disp(m.items[i]); });
  R.touched = [];
  $("#rdText").querySelectorAll(".rd-sticky").forEach(n => n.remove());
  const byPage = new Map();
  m.items.forEach((it, i) => { if (it.l === undefined || !R.spanEls[i]) return; let a = byPage.get(it.p); if (!a){ a = []; byPage.set(it.p, a); } a.push(i); });
  const cover = new Map();
  R.anns.forEach((a, ai) => {
    if (a.type === "highlight"){
      (a.positions || []).forEach(pos => {
        if (!pos || !pos.top_left || !pos.bottom_right) return;
        const xl = Math.min(pos.top_left.x, pos.bottom_right.x), xr = Math.max(pos.top_left.x, pos.bottom_right.x);
        const yb = Math.min(pos.top_left.y, pos.bottom_right.y), yt = Math.max(pos.top_left.y, pos.bottom_right.y);
        for (const i of (byPage.get(pos.page) || [])){

          if (Math.min(yt, itp) - Math.max(yb, ib) < it.h * 0.4) continue;

          const L = it.s.length, cw = it.w / Math.max(1, L);
          let s = Math.round((xl - it.x) / cw), e = Math.round((xr - it.x) / cw);
          s = Math.max(0, Math.min(L, s)); e = Math.max(0, Math.min(L, e));
          if (e <= s) continue;
          let arr = cover.get(i); if (!arr){ arr = new Array(L).fill(-1); cover.set(i, arr); }
          for (let k = s; k < e; k++) arr[k] = ai;
        }
      });
    } else if (a.type === "sticky_note"){
      const pos = a.positions && a.positions[0]; if (!pos) return;
      let best = -1, bd = Infinity;
      for (const i of (byPage.get(pos.page) || [])){
        const it = m.items[i];
        const dy = Math.abs(it.y + it.h * 0.3 - pos.top_left.y), dx = Math.max(0, it.x - pos.top_left.x, pos.top_left.x - (it.x + it.w));
        const dist = dy * 3 + dx; if (dist < bd){ bd = dist; best = i; }
      }
      if (best >= 0){
        const b = el("button", { class: "rd-sticky", "data-a": a.id, "aria-label": "Note: " + (a.text || ""), text: "✎" });
        b.style.setProperty("--hl", rgb(a.color));
        R.spanEls[best].before(b);
      }
    }
  });
  cover.forEach((arr, i) => {
    const sp = R.spanEls[i]; const text = disp(m.items[i]);
    sp.replaceChildren();
    let k = 0;
    while (k < text.length){

function wordAt(x, y){
  let node = null, off = 0;
  if (document.caretRangeFromPoint){ const r = document.caretRangeFromPoint(x, y); if (r){ node = r.startContainer; off = r.startOffset; } }
  else if (document.caretPositionFromPoint){ const p = document.caretPositionFromPoint(x, y); if (p){ node = p.offsetNode; off = p.offset; } }
  if (!node || node.nodeType !== 3 || !$("#rdText").contains(node)) return null;
  const t = node.data; let s = Math.min(off, t.length);
  if ((s >= t.length || /\s/.test(t[s])) && s > 0 && /\S/.test(t[s - 1])) s--;
  let e = s;
  while (s > 0 && /\S/.test(t[s - 1])) s--;
  while (e < t.length && /\S/.test(t[e])) e++;
  if (e <= s) return null;
  const r = document.createRange(); r.setStart(node, s); r.setEnd(node, e); return r;
}
function handleTap(e){
  const w = wordAt(e.clientX, e.clientY); if (!w) return;
  try { window.getSelection().removeAllRanges(); } catch (err) {}
  if (!R.tapAnchor || R.tapStage !== 1){ R.tapAnchor = w; R.tapStage = 1; R.lastRange = w.cloneRange(); }
  else {
    const r = document.createRange();
    if (w.compareBoundaryPoints(Range.START_TO_START, R.tapAnchor) < 0){ r.setStart(w.startContainer, w.startOffset); r.setEnd(R.tapAnchor.endContainer, R.tapAnchor.endOffset); }
    else { r.setStart(R.tapAnchor.startContainer, R.tapAnchor.startOffset); r.setEnd(w.endContainer, w.endOffset); }
    R.lastRange = r; R.tapStage = 2;
  }

}
function offsetIn(root, node, off){ const r = document.createRange(); r.setStart(root, 0); r.setEnd(node, off); return r.toString().length; }
function rangeToPositions(range){
  const m = R.model; const segs = [];
  const spans = Array.from($("#rdText").querySelectorAll("span[data-i]")).filter(sp => range.intersectsNode(sp));
  for (const sp of spans){
    const i = +sp.dataset.i; const len = sp.textContent.length;
    let s = 0, e = len;
    if (sp.contains(range.startContainer)) s = offsetIn(sp, range.startContainer, range.startOffset);
    if (sp.contains(range.endContainer)) e = offsetIn(sp, range.endContainer, range.endOffset);
    if (e > s) segs.push({ i: i, s: s, e: e });
  }
  const groups = new Map();
  for (const g of segs){
    const it = m.items[g.i]; const L = it.s.length || 1, cw = it.w / L;
    const key = it.p + ":" + it.l;
    const x0 = it.x + cw * g.s, x1 = it.x + cw * g.e, yb = it.y - it.h * 0.2, yt = it.y + it.h * 0.8;
    const cur = groups.get(key);
    if (!cur) groups.set(key, { page: it.p, x0: x0, x1: x1, yb: yb, yt: yt });
    else { cur.x0 = Math.min(cur.x0, x0); cur.x1 = Math.max(cur.x1, x1); cur.yb = Math.min(cur.yb, yb); cur.yt = Math.max(cur.yt, yt); }
  }
  const r2 = v => Math.round(v * 100) / 100;
  return Array.from(groups.values()).map(g => ({ top_left: { x: r2(g.x0), y: r2(g.yb) }, bottom_right: { x: r2(g.x1), y: r2(g.yt) }, page: g.page }));
}

/* ================= Folders: create, rename, delete ================= */
function folderTree(){
  const byParent = new Map(), ids = new Set(S.folders.map(f => f.id)), seen = new Set(), out = [];
  S.folders.forEach(f => { const k = f.parent_id && ids.has(f.parent_id) ? f.parent_id : ""; if (!byParent.has(k)) byParent.set(k, []); byParent.get(k).push(f); });
  const walk = (pid, depth) => {
    (byParent.get(pid) || []).slice().sort((a, b) => (a.name || "").localeCompare(b.name || "", "en-GB", { sensitivity: "base" })).forEach(f => {
      if (seen.has(f.id)) return; seen.add(f.id); out.push({ f: f, depth: depth }); walk(f.id, depth + 1);
    });
  };
  walk("", 0);
  return out;
}
const folderLabel = (f, depth) => "› ".repeat(depth) + f.name;
function saveFolders(){ DB.set("folders", S.folders).catch(() => {}); DB.set("members", S.members).catch(() => {}); }
async function createFolder(name, parentId){
  name = (name || "").trim();
  if (!name) throw new Error("Give the folder a name first.");
  const body = { name: name }; if (parentId) body.parent_id = parentId;
  const f = await api("POST", "/folders", { type: MT.folder, accept: MT.folder, body: JSON.stringify(body) });
  S.folders.push(f); S.members[f.id] = []; saveFolders(); return f;
}
async function renameFolder(id, name){
  name = (name || "").trim(); if (!name) throw new Error("The name can’t be empty.");
  const f = await api("PATCH", "/folders/" + id, { type: MT.folder, accept: MT.folder, body: JSON.stringify({ name: name }) });
  const cur = S.folders.find(x => x.id === id); if (cur) cur.name = (f && f.name) || name; saveFolders();
}
async function deleteFolder(id){
  await api("DELETE", "/folders/" + id);
  const gone = new Set([id]); let grew = true;
  while (grew){ grew = false; S.folders.forEach(f => { if (f.parent_id && gone.has(f.parent_id) && !gone.has(f.id)){ gone.add(f.id); grew = true; } }); }
  S.folders = S.folders.filter(f => !gone.has(f.id)); gone.forEach(g => delete S.members[g]);
  if (gone.has(S.view.folder)){ S.view.folder = ""; saveView(); }
  saveFolders();
}
const folderErr = e => e.code === "auth" ? "Sign in again to change folders." : e.code === "network" ? "You’re offline. Folders can only be changed with a connection." : e.message;

}

function coverText(m, positions){
  const segs = [];
  (positions || []).forEach(pos => {
    if (!pos || !pos.top_left || !pos.bottom_right) return;
    const xl = Math.min(pos.top_left.x, pos.bottom_right.x), xr = Math.max(pos.top_left.x, pos.bottom_right.x);
    const yb = Math.min(pos.top_left.y, pos.bottom_right.y), yt = Math.max(pos.top_left.y, pos.bottom_right.y);
    m.items.forEach((it, i) => {
      if (it.p !== pos.page || it.l === undefined) return;
      const ib = it.y - it.h * 0.2, itp = it.y + it.h * 0.8;
      if (Math.min(yt, itp) - Math.max(yb, ib) < it.h * 0.4) return;
      if (xr < it.x || xl > it.x + it.w) return;
      const L = it.s.length, cw = it.w / Math.max(1, L);
      const s = Math.max(0, Math.min(L, Math.round((xl - it.x) / cw))), e = Math.max(0, Math.min(L, Math.round((xr - it.x) / cw)));
      if (e > s) segs.push({ i: i, t: disp(it).slice(s, e) });
    });
  });
  segs.sort((a, b) => a.i - b.i);
  return segs.map(x => x.t).join(" ").replace(/\s+/g, " ").trim();
}
function modelText(m){
  return m.paras.map(p => {
    const t = p.t.map(x => x === " " ? " " : disp(m.items[x])).join("").replace(/\s+/g, " ").trim();
    return p.k === "h" ? "#### " + t : t;
  }).filter(Boolean).join("\n\n");
}
async function buildExport(docs, incAnn, incText, onStatus){
  const annsByDoc = new Map();
  if (incAnn && tokenValid()){
    onStatus("Fetching highlights and notes from Mendeley…");
    try {
      const all = await listAll("/annotations?limit=200", MT.ann, n => onStatus("Fetching highlights and notes… " + n));
      all.forEach(a => { if (!a.document_id) return; let l = annsByDoc.get(a.document_id); if (!l){ l = []; annsByDoc.set(a.document_id, l); } l.push(a); });
    } catch (e) { if (e.code === "auth") throw e; }
  }
  const folderNames = new Map();
  S.folders.forEach(f => (S.members[f.id] || []).forEach(id => { let l = folderNames.get(id); if (!l){ l = []; folderNames.set(id, l); } l.push(f.name); }));
  const out = ["# My Mendeley library", "", "Exported " + new Date().toLocaleDateString("en-GB", { day: "numeric", month: "long", year: "numeric" }) + ". " + docs.length + (docs.length === 1 ? " paper." : " papers."), ""];
  let withText = 0, withHl = 0;
  for (let k = 0; k < docs.length; k++){
    const d = docs[k];
    if (k % 20 === 0) onStatus("Writing paper " + (k + 1) + " of " + docs.length + "…");
    out.push("## " + (d.title || "Untitled"), "");
    const meta = [];
    if (d.authors && d.authors.length) meta.push("Authors: " + fullAuthors(d.authors));
    if (d.year) meta.push("Year: " + d.year);
    if (venue(d)) meta.push("Published in: " + venue(d));
    if (d.type) meta.push("Type: " + d.type.replace(/_/g, " "));
    const ids = d.identifiers || {};
    if (ids.doi) meta.push("DOI: " + ids.doi);
    if (ids.isbn) meta.push("ISBN: " + ids.isbn);
    if (d.tags && d.tags.length) meta.push("Tags: " + d.tags.join(", "));
    if (folderNames.get(d.id)) meta.push("Folders: " + folderNames.get(d.id).join(", "));
    meta.push("Status: " + (d.read ? "read" : "unread") + (d.starred ? ", starred" : ""));
    meta.forEach(x => out.push("- " + x)); out.push("");
    if (d.abstract) out.push("### Abstract", "", d.abstract.trim(), "");
    let model = null, cachedAnns = null;
    try {
      const fs = await DB.get("files:" + d.id); const f = pickPdf(fs);
      if (f) model = await DB.get("txt:" + f.id);
      cachedAnns = await DB.get("ann:" + d.id);
    } catch (e) {}
    const anns = annsByDoc.get(d.id) || [];
    const notes = anns.filter(a => a.type === "note" && a.text).map(a => stripHtml(a.text)).filter(Boolean);
    if (notes.length) out.push("### My notes", "", notes.join("\n\n"), "");
    const quotes = new Map((cachedAnns || []).map(a => [a.id, a._quote]));
    const hls = anns.filter(a => a.type === "highlight" || a.type === "sticky_note").sort((a, b) => {
      const pa = (a.positions && a.positions[0]) || {}, pb = (b.positions && b.positions[0]) || {};
      return (pa.page || 0) - (pb.page || 0) || ((pb.top_left && pb.top_left.y) || 0) - ((pa.top_left && pa.top_left.y) || 0);
    });
    if (hls.length){
      withHl++;
      out.push("### My highlights", "");
      hls.forEach(a => {
        const page = a.positions && a.positions[0] && a.positions[0].page;
        const where = page ? "p. " + page + ": " : "";
        if (a.type === "sticky_note") out.push("- " + where + "Note: " + stripHtml(a.text || ""));
        else {
          const q = quotes.get(a.id) || (model ? coverText(model, a.positions) : "");
          out.push("- " + where + (q ? "“" + q + "”" : "(highlighted passage; open the paper once in the reader to include its text)"));
          if (a.text) out.push("  Note: " + stripHtml(a.text));
        }
      });
      out.push("");
    }
    if (incText && model){ withText++; out.push("### Full text", "", modelText(model), ""); }
    out.push("---", "");
  }
  return { text: out.join("\n"), withText: withText, withHl: withHl };
}
function openExport(){
  sheetId = null; sheetMode = "export";
  const viewDocs = visible(), allDocs = Array.from(S.lib.values());
  const scopeAll = el("input", { type: "radio", name: "exscope", checked: true });
  const scopeView = el("input", { type: "radio", name: "exscope" });
  const incAnn = el("input", { type: "checkbox", checked: true });
  const incText = el("input", { type: "checkbox", checked: true });
  const status = el("p", { class: "hint", "aria-live": "polite" });
  const result = el("div", {});
  const lab = (input, text) => el("label", { style: "display:flex;gap:10px;align-items:flex-start;padding:8px 0" }, input, el("span", { text: text }));
  const prep = el("button", { class: "btn", text: "Prepare export" });
  prep.addEventListener("click", async () => {
    prep.disabled = true; result.replaceChildren();
    try {
      const docs = scopeView.checked ? viewDocs : allDocs;
      const r = await buildExport(docs, incAnn.checked, incText.checked, t => status.textContent = t);
      const date = new Date().toISOString().slice(0, 10);
      const name = "mendeley-library-" + date + ".md";
      const file = new File([r.text], name, { type: "text/markdown" });
      const mb = (file.size / 1048576).toFixed(1);
      status.textContent = "Ready. " + docs.length + (docs.length === 1 ? " paper, " : " papers, ") + r.withHl + " with highlights, " + r.withText + " with full text (" + mb + " MB).";
      const canShare = navigator.canShare && navigator.canShare({ files: [file] });
      setKids(result,
        el("div", { class: "actions" },
          canShare ? el("button", { class: "btn", text: "Share to Claude…", onclick: () => navigator.share({ files: [file], title: "My Mendeley library" }).catch(() => {}) }) : null,
          el("button", { class: canShare ? "btn line" : "btn", text: "Save to Files", onclick: () => {
            const url = URL.createObjectURL(file); const a = document.createElement("a");
            a.href = url; a.download = name; document.body.append(a); a.click(); a.remove();
            setTimeout(() => URL.revokeObjectURL(url), 60000);
          }})));
    } catch (e) {
      status.textContent = e.code === "auth" ? "Sign in again, then try once more." : "Export failed: " + e.message;
    }
    prep.disabled = false;
  });
  $("#sheetRight").replaceChildren();
  setKids($("#sheetBody"),
    el("h2", { text: "Export for Claude" }),
    el("p", { text: "Makes one file with your papers’ details, abstracts, notes, highlights and full text, ready to add to a Claude project so Claude can work across your whole library." }),
    el("div", { class: "section" }, el("h3", { text: "Which papers" }),
      lab(scopeAll, "Whole library (" + allDocs.length + ")"),
      lab(scopeView, "Only the current list on screen (" + viewDocs.length + ")")),
    el("div", { class: "section" }, el("h3", { text: "Include" }),
      lab(incAnn, "Highlights and notes"),
      lab(incText, "Full text of papers saved on this phone")),
    el("p", { class: "hint", text: "Full text and highlighted passages come from papers you’ve opened in the reader at least once, since those are the ones saved on this phone." }),
    el("div", { class: "actions" }, prep),
    status, result);
  $("#sheet").classList.add("open"); $("#sheet").scrollTop = 0;
}

/* ================= Start ================= */
async function start(){
  handleRedirect();
  try { await DB.open(); } catch (e) {}
  try {
    const docs = await DB.all(); (docs || []).forEach(d => S.lib.set(d.id, d));
    S.folders = (await DB.get("folders")) || []; S.members = (await DB.get("members")) || {};
  } catch (e) {}
  render();
  if (!clientId()) return;
  if (!tokenValid() && S.meta.everSignedIn && navigator.onLine){
    let tried = false; try { tried = sessionStorage.getItem("mfe-auto") === "1"; sessionStorage.setItem("mfe-auto", "1"); } catch (e) { tried = true; }
    if (!tried){ signIn(); return; }
  }
  if (tokenValid()) sync();
}
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible" && tokenValid() && Date.now() - (S.meta.lastSyncAt || 0) > 60000) sync(); });
window.addEventListener("online", () => { if (tokenValid()) sync(); });
setInterval(() => { if (document.visibilityState === "visible" && tokenValid()) sync(); }, 3 * 60000);
setInterval(() => { if (built && !S.syncing) setStatus(statusText()); if (S.tok && !tokenValid() && built) { render(); } }, 30000);
start();
})();
</script>
